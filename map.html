   '<div class="t">'+esc(d.title)+'</div><div class="c"><span class="b">'+d.score+' '+t('pt')+'</span> 💰฿'+(d.price?d.price.toLocaleString():'?')+t('month')+
   (d.size?' ・ '+d.size+'m²':'')+(d.dist!=null?' ・ '+t('dist')+' '+d.dist+'km':'')+'<br>'+c.join(' ')+(d.area?' ・ 📍'+esc(d.area):'')+'</div>'+
   '<div class="lk"><a class="a" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+t('view')+'</a><a class="b2" href="'+esc(d.gmaps)+'" target="_blank" rel="noopener">'+t('map')+'</a></div></div>';}
function thumbHTML(d){return '<div class="thumb" style="border-color:'+color(d.score)+'">'+(d.cover?'<img src="'+d.cover+'" loading="lazy">':'')+'<span class="sc">'+d.score+'</span></div>';}
const listingLayer=L.layerGroup().addTo(map);
const THUMB_MAX=40, RENDER_MAX=220;
const POPOPTS={maxWidth:Math.min(Math.round(innerWidth*0.92),460), minWidth:Math.min(Math.round(innerWidth*0.92),300), maxHeight:Math.round(innerHeight*0.74), autoPan:true, autoPanPadding:[14,14]};
function rebuild(){
  listingLayer.clearLayers();
  const b=map.getBounds(); let vis2=filtered().filter(d=>b.contains([d.lat,d.lon]));
  const total=filtered().length; const photo=vis2.length<=THUMB_MAX;
  vis2.slice(0,RENDER_MAX).forEach(d=>{let m;
    if(photo&&d.cover) m=L.marker([d.lat,d.lon],{icon:L.divIcon({className:'',html:thumbHTML(d),iconSize:[90,90],iconAnchor:[45,45]}),riseOnHover:true});
    else m=L.circleMarker([d.lat,d.lon],{radius:Math.max(5,(d.score-40)/6),color:'#fff',weight:1,fillColor:color(d.score),fillOpacity:.9});
    m.bindPopup(()=>popupHTML(d),POPOPTS); listingLayer.addLayer(m);});
  document.getElementById('cnt').textContent=t('cnt',{n:vis2.length,t:total})+(photo?'':' '+t('zoomHint'));
}
map.on('moveend',rebuild);

// ── panel / i18n ──
function buildToggles(){
  const defs=[['road','🛣️'],['mrt','🚆'],['mall','🛒'],['hosp','🏥'],['conv','🏪']];
  document.getElementById('toggles').innerHTML=defs.map(([k,em])=>'<span class="tg'+(vis[k]?' on':'')+'" data-k="'+k+'">'+em+' '+t(k)+'</span>').join('');
  document.querySelectorAll('.tg').forEach(el=>el.onclick=()=>{const k=el.dataset.k;vis[k]=!vis[k];
    if(vis[k])layers[k].addTo(map);else map.removeLayer(layers[k]); el.classList.toggle('on',vis[k]);});
}
function applyLang(){
  document.getElementById('title').textContent=t('title');
  document.getElementById('back').textContent=t('back');
  document.getElementById('blang').textContent=LANG==='zh'?'ไทย':'中文';
  document.getElementById('lblScore').textContent=t('score');
  document.getElementById('lblAir').textContent=t('air');
  document.getElementById('lblVac').textContent=t('vac');
  document.documentElement.lang=LANG==='zh'?'zh-Hant':'th';
  buildToggles(); rebuild();
}
document.getElementById('smin').addEventListener('input',e=>{document.getElementById('sv').textContent=e.target.value;rebuild();});
document.getElementById('fair').addEventListener('change',rebuild);
document.getElementById('fvac').addEventListener('change',rebuild);
document.getElementById('blang').onclick=()=>{LANG=LANG==='zh'?'th':'zh';store.set("siriraj_lang",LANG);map.closePopup();applyLang();};
applyLang();
</script>
</body>
