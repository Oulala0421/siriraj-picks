<style>
  :root{ --like:#2ecc71; --pass:#ff5a5f; --ink:#22202b; --muted:#8a8694; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0; font-family:"Noto Sans Thai",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink); background:linear-gradient(160deg,#ffe9d6 0%,#ffd5e1 45%,#e7d8ff 100%);
    display:flex; flex-direction:column; align-items:center; min-height:100%; overflow:hidden}
  header{width:100%; max-width:480px; padding:9px 14px 2px; display:flex; align-items:center; gap:7px}
  header h1{font-size:15px; margin:0; white-space:nowrap}
  .hstat{font-size:12px; color:#5b5667; font-weight:800; text-align:center; flex:1; line-height:1.2}
  .hstat b{color:#d6336c}
  header button.tb{font:inherit; border:none; background:#ffffffcc; padding:7px 10px; border-radius:999px; cursor:pointer; font-weight:800; box-shadow:0 1px 3px #0002; white-space:nowrap; font-size:12.5px}
  header button.lang{background:#22202b; color:#fff}
  .bar{width:100%; max-width:480px; height:5px; background:#ffffff66; border-radius:9px; margin:4px 14px 0; overflow:hidden}
  .bar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,#ff7a45,#ff4d79); transition:width .25s}

    box-shadow:0 16px 36px #0003, 0 2px 6px #0002; will-change:transform; touch-action:pan-y; display:flex; flex-direction:column}
  .photo{position:relative; width:100%; aspect-ratio:4/3.05; flex:none; background:#1d1b27 center/cover no-repeat; user-select:none}
  .photo .nav{position:absolute; inset:0; display:flex}
  .photo .nav span{flex:1; cursor:pointer}
  .pcount{position:absolute; top:10px; left:12px; background:#0007; color:#fff; font-size:12px; padding:3px 9px; border-radius:999px; font-weight:700}

  .stamp.pass{right:18px; color:var(--pass); border-color:var(--pass); transform:rotate(16deg)}

  .parea{position:absolute; left:14px; bottom:10px; color:#fff; font-size:13px; font-weight:800; text-shadow:0 1px 4px #000a; background:#0006; padding:3px 9px; border-radius:999px}
  .body{padding:11px 15px 14px; flex:1; overflow:auto}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:12.5px; font-weight:700; padding:5px 9px; border-radius:999px; background:#f1eef6; color:#3c3850; white-space:nowrap}
  .chip.k{background:#eafaf0; color:#178a4c}
  .chip.warn{background:#fdeaea; color:#c0392b}
  .chip.big{font-size:13.5px}
  details{margin-top:10px; font-size:12.5px; color:#4b4757}
  details summary{cursor:pointer; font-weight:700; color:#6a5acd}
  .rt{margin-top:6px; line-height:1.7}
  .addr{margin-top:9px; font-size:12px; color:var(--muted); line-height:1.4}
  .links{margin-top:10px; display:flex; gap:8px}
  .links a{flex:1; text-align:center; text-decoration:none; font-weight:800; font-size:13px; padding:9px; border-radius:11px}
  .links a.l1{background:#ff7a45; color:#fff} .links a.l2{background:#1f6feb; color:#fff}
  .actions{width:100%; max-width:480px; display:flex; gap:30px; align-items:center; justify-content:center; padding:10px 0 16px}
  .actions button{border:none; cursor:pointer; border-radius:50%; box-shadow:0 6px 16px #0003; display:grid; place-items:center; background:#fff; transition:transform .1s}
  .actions button:active{transform:scale(.9)}
  .b-undo{width:46px; height:46px; font-size:20px; color:#b9a14a}
  .b-pass{width:70px; height:70px; font-size:34px; color:var(--pass)}
  .b-like{width:70px; height:70px; font-size:34px; color:var(--like)}
  .lbls{width:100%; max-width:480px; display:flex; justify-content:space-between; padding:0 24px 12px; font-size:12px; font-weight:800; color:#7a7587}
  .lbls .l{color:var(--pass)} .lbls .r{color:var(--like)}
  .screen{position:fixed; inset:0; z-index:1000; background:linear-gradient(160deg,#fff,#ffeede); overflow:auto; padding:18px 16px 40px; display:none}
  .screen.show{display:block}
  .screen h2{margin:6px 0 2px; font-size:21px}
  .screen .sub{color:#6a6577; font-size:13px; margin-bottom:14px; font-weight:600}
  .tools{display:flex; gap:10px; flex-wrap:wrap; margin:2px 0 16px}
  .tools button{font:inherit; font-weight:800; border:none; border-radius:11px; padding:11px 15px; cursor:pointer}
  .tools .go{background:#ff5a7a; color:#fff} .tools .exp{background:#2ecc71; color:#fff}
  .tools .bk{background:#fff; color:#555; box-shadow:0 1px 3px #0002} .tools .rs{background:#eee; color:#777}
  .item{display:flex; gap:10px; background:#fff; border-radius:14px; padding:10px; margin-bottom:10px; box-shadow:0 2px 8px #0001; align-items:center}
  .item img{width:78px; height:78px; object-fit:cover; border-radius:10px; background:#eee; flex:none}
  .item .meta{flex:1; min-width:0}
  .item .t{font-weight:800; font-size:14px; line-height:1.3; max-height:36px; overflow:hidden}
  .item .s{font-size:12px; color:#5b5667; margin-top:3px}
  .item .lk{display:flex; gap:10px; margin-top:6px}
  .item .lk a{font-size:12px; font-weight:800; text-decoration:none; color:#1f6feb}
  .pill{font-size:11px; font-weight:800; padding:2px 7px; border-radius:999px; background:#ff7a45; color:#fff}
  .empty{color:#9a95a6; text-align:center; padding:30px}
  .err{padding:30px; color:#c0392b; font-weight:700; text-align:center}
</style>

function chipsHTML(d){
  const c=[];
  c.push(`<span class="chip big">💰 ฿${d.price?d.price.toLocaleString():"?"}${t('month')}</span>`);
  if(d.size) c.push(`<span class="chip">📐 ${d.size} m²</span>`);
  if(d.dist!=null) c.push(`<span class="chip">📍 ${d.dist} km ${t('distTo')}</span>`);
  if(d.mrt!=null) c.push(`<span class="chip">🚆 MRT ~${d.mrt}m</span>`);
  if(d.air===true) c.push(`<span class="chip k">❄️ ${t('air')}</span>`); else if(d.air===false) c.push(`<span class="chip warn">${t('noair')}</span>`);

  if(d.sec) c.push(`<span class="chip k">🔒 ${esc(d.sec)}</span>`);
  if(d.vac==="有") c.push(`<span class="chip k">🟢 ${t('vacY')}</span>`); else if(d.vac&&d.vac.indexOf("無")===0) c.push(`<span class="chip warn">🔴 ${t('vacN')}</span>`);
  if(d.review!=null) c.push(`<span class="chip">⭐ ${t('review')} ${d.review}</span>`);
  (d.flags||[]).forEach(f=>c.push(`<span class="chip warn">⚠ ${esc(flagTxt(f))}</span>`));
  return c.join("");
}

function bindPhoto(card,d){

}
function bindSwipe(card){
  let x0=0,dx=0,drag=false;
  const down=e=>{drag=true; const p=e.touches?e.touches[0]:e; x0=p.clientX; card.style.transition="none";};
  const move=e=>{if(!drag)return; const p=e.touches?e.touches[0]:e; dx=p.clientX-x0;
    card.style.transform=`translate(${dx}px,${dx/14}px) rotate(${dx/18}deg)`;
    card.querySelector(".stamp.like").style.opacity=dx>40?Math.min(1,dx/120):0;
    card.querySelector(".stamp.pass").style.opacity=dx<-40?Math.min(1,-dx/120):0;};
  const up=()=>{if(!drag)return; drag=false; card.style.transition="transform .3s ease";
    if(dx>95)fling(true); else if(dx<-95)fling(false); else card.style.transform=""; dx=0;};
  card.addEventListener("mousedown",down); window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
  card.addEventListener("touchstart",down,{passive:true}); card.addEventListener("touchmove",move,{passive:true}); card.addEventListener("touchend",up);
}
function fling(choose){

function itemHTML(d){ return `<div class="item">
  <img src="${d.photos&&d.photos[0]?d.photos[0]:''}" onerror="this.style.visibility='hidden'">
  <div class="meta"><div class="t"><span class="pill">${d.score}</span> ${esc(d.title)}</div>
   <div class="s">${esc(areaTxt(d.area))} ・ ฿${d.price?d.price.toLocaleString():'?'}${t('month')}${d.size?' ・ '+d.size+'m²':''}${d.dist!=null?' ・ '+d.dist+'km':''}${d.air===true?' ・ ❄️':''}${d.lift===true?' ・ 🛗':''}${d.vac==='有'?' ・ 🟢':''}</div>
   <div class="lk"><a href="${esc(d.url)}" target="_blank" rel="noopener">${t('view')}</a><a href="${esc(d.gmaps)}" target="_blank" rel="noopener">${t('map')}</a></div>
  </div></div>`; }
function renderOverlay(){ overlay==='picks'?renderPicks():renderRound(); }
function renderRound(){
  const chosen=state.chosen.map(i=>DATA[i]); const sc=$("screen");
  let tools=`<button class="bk" onclick="restartRound()">${t('restartR')}</button>`;
  if(state.prev.length) tools+=`<button class="bk" onclick="prevRound()">${t('prevR')}</button>`;
  if(chosen.length>=2) tools=`<button class="go" onclick="nextRound()">${t('nextR',{c:chosen.length})}</button>`+tools;
  if(chosen.length>=1) tools+=`<button class="exp" onclick="exportCSV()">${t('exp')}</button>`;
  tools+=`<button class="rs" onclick="resetAll()">${t('resetA')}</button>`;
  const head=chosen.length?t('roundDone',{r:state.round,p:state.pool.length,c:chosen.length}):t('allElim',{r:state.round,p:state.pool.length});
  sc.innerHTML=`<h2>${chosen.length>=2?t('pickedTitle'):t('yourList')}</h2>
    <div class="sub">${head}${chosen.length>=2?t('refineHint'):''}</div><div class="tools">${tools}</div>
    ${chosen.length?chosen.map(itemHTML).join(""):'<div class="empty">'+t('emptyRound')+'</div>'}`;
  sc.classList.add("show");
}
function renderPicks(){
  const chosen=state.chosen.map(i=>DATA[i]); const sc=$("screen");
  sc.innerHTML=`<h2>${t('nowPicked',{n:chosen.length})}</h2><div class="sub">${t('nowSub',{r:state.round,s:state.pos,p:state.pool.length})}</div>
    <div class="tools"><button class="bk" onclick="closeScreen()">${t('cont')}</button>${chosen.length?'<button class="exp" onclick="exportCSV()">'+t('exp')+'</button>':''}<button class="rs" onclick="resetAll()">${t('resetA')}</button></div>
    ${chosen.length?chosen.map(itemHTML).join(""):'<div class="empty">'+t('emptyPicks')+'</div>'}`;
  sc.classList.add("show");
}
function closeScreen(){ overlay=null; $("screen").classList.remove("show"); render(); }
function nextRound(){ state.prev.push({pool:state.pool,round:state.round}); state.pool=state.chosen.slice(); state.pos=0; state.chosen=[]; state.actions=[]; state.round++; save(); overlay=null; $("screen").classList.remove("show"); render(); }
function prevRound(){ if(!state.prev.length)return; const p=state.prev.pop(); state.pool=p.pool; state.round=p.round; state.pos=0; state.chosen=[]; state.actions=[]; save(); overlay=null; $("screen").classList.remove("show"); render(); }
function restartRound(){ state.pos=0; state.chosen=[]; state.actions=[]; save(); overlay=null; $("screen").classList.remove("show"); render(); }
function resetAll(){ if(confirm(t('confirmReset'))){ state=freshState(); save(); overlay=null; $("screen").classList.remove("show"); render(); } }
function exportCSV(){
  const rows=[["rank","score","price","size_m2","dist_km","aircon","lift","vacancy","area","title","listing_url","gmaps"]];
  state.chosen.map(i=>DATA[i]).forEach(d=>rows.push([d.rank,d.score,d.price||"",d.size||"",d.dist!=null?d.dist:"",d.air===true?'Y':(d.air===false?'N':'?'),d.lift===true?'Y':'',d.vac||"",d.area||"",d.title,d.url,d.gmaps]));
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  try{const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="siriraj_shortlist.csv"; a.click();}catch(e){alert("CSV export failed; use rooms_scored.xlsx");}
}
applyStatic(); render();
</script>
</body>
</html>
